<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pig-face.svg" />
    <!-- viewport-fit=cover: o app ocupa a tela inteira, inclusive atrás do notch e da barra de
         gestos; o CSS devolve esse espaço com env(safe-area-inset-*) onde há conteúdo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf0f4" />
    <!-- Nenhuma requisição leva o endereço da página no Referer: a tela de redefinição de senha
         chega com o token na URL, e ele não pode vazar para quem quer que receba a requisição. -->
    <meta name="referrer" content="no-referrer" />
    <title>Life and Money</title>
    <meta name="description" content="Controle financeiro pessoal feito para o celular: gastos do dia a dia, orçamento por categoria, metas de poupança e contas do mês." />
    <!-- Prévia do link (LinkedIn, WhatsApp, Slack, X). A imagem precisa de URL absoluta: quem monta
         a prévia busca o arquivo de fora, sem saber de que página o link veio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Life and Money" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://life-and-money.akira-tochiro23.workers.dev/" />
    <meta property="og:title" content="Life and Money — seu dinheiro em ordem, direto do celular" />
    <meta property="og:description" content="Gastos do dia a dia, orçamento por categoria, metas de poupança e contas do mês. Gratuito e feito para o celular." />
    <meta property="og:image" content="https://life-and-money.akira-tochiro23.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="O app Life and Money no celular: o saldo do mês, as contas a vencer e os gastos por categoria." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
