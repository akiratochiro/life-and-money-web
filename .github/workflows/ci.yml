name: CI

# Roda a cada push e em cada pull request para a main: nada entra na main sem
# o lint, os testes e o build (que inclui a checagem de tipos) passando.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um push novo na mesma branch cancela a execução anterior, que já está obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # "npm ci" instala exatamente o que está no package-lock.json, sem
      # resolver versões de novo: o build da CI usa as mesmas dependências
      # que o build da máquina.
      - name: Instalar as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # "npm test" é "vitest run": roda os testes uma vez e sai com erro se algum
      # falhar. O modo watch fica no "npm run test:watch", para a máquina local.
      - name: Testes
        run: npm test

      # O script de build é "tsc -b && vite build", então a checagem de tipos
      # roda aqui: um tipo quebrado derruba a CI antes de gerar o bundle.
      - name: Checar tipos e gerar o bundle
        run: npm run build
